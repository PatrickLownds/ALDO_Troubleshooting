# Theme setting
theme: jekyll-theme-cayman

# Header subtitle setting
description: ""

# GitHub Pages subpath configuration
url: "https://PatrickLownds.github.io"
baseurl: "/ALDO_Troubleshooting"

# Plugins
plugins:
  - jekyll-relative-links

# Configure relative links plugin to rewrite .md to clean web URLs
relative_links:
  enabled: true
  collections: true
  collections_and_folders: true
